<svg viewBox="0 0 1120 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#6a1b9a"/>
    </marker>
  </defs>
  <rect width="1120" height="700" fill="#ffffff"/>

  <text x="560" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#111">B6 TAM KONTROLLÜ KÖPRÜ — GÜÇ DEVRESİ</text>
  <text x="560" y="53" text-anchor="middle" font-size="12.5" fill="#666">6 × BT151-500R · her 60°'de bir SCR ateşlenir · çevrimde 6 darbe (300 Hz)</text>

  <!-- ======= RAYLAR ======= -->
  <line x1="252" y1="120" x2="920" y2="120" stroke="#c62828" stroke-width="3.5"/>
  <line x1="252" y1="545" x2="920" y2="545" stroke="#1565c0" stroke-width="3.5"/>
  <text x="946" y="116" font-size="14" font-weight="bold" fill="#c62828">DC_POS</text>
  <text x="946" y="132" font-size="10.5" fill="#999">(+)</text>
  <text x="946" y="541" font-size="14" font-weight="bold" fill="#1565c0">DC_NEG</text>
  <text x="946" y="557" font-size="10.5" fill="#999">(−)</text>

  <!-- ======= TRAFO ======= -->
  <rect x="42" y="252" width="76" height="150" rx="5" fill="#fff8e1" stroke="#f57f17" stroke-width="2"/>
  <text x="80" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">3~</text>
  <text x="80" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">47 V</text>
  <text x="80" y="345" text-anchor="middle" font-size="11" fill="#e65100">yıldız</text>
  <text x="80" y="368" text-anchor="middle" font-size="10.5" fill="#999">81,4 V</text>
  <text x="80" y="382" text-anchor="middle" font-size="10.5" fill="#999">hat-hat</text>

  <!-- ======= FAZ HATLARI ======= -->
  <!-- R -->
  <line x1="118" y1="300" x2="320" y2="300" stroke="#333" stroke-width="2.2"/>
  <text x="132" y="292" font-size="14" font-weight="bold" fill="#333">R</text>
  <circle cx="320" cy="300" r="4.5" fill="#333"/>
  <!-- S (leg1'de atlama) -->
  <path d="M118,330 L312,330" stroke="#333" stroke-width="2.2" fill="none"/>
  <path d="M312,330 A8,8 0 0,1 328,330" stroke="#333" stroke-width="2.2" fill="none"/>
  <line x1="328" y1="330" x2="470" y2="330" stroke="#333" stroke-width="2.2"/>
  <text x="132" y="322" font-size="14" font-weight="bold" fill="#333">S</text>
  <circle cx="470" cy="330" r="4.5" fill="#333"/>
  <!-- T (leg1 ve leg2'de atlama) -->
  <path d="M118,360 L312,360" stroke="#333" stroke-width="2.2" fill="none"/>
  <path d="M312,360 A8,8 0 0,1 328,360" stroke="#333" stroke-width="2.2" fill="none"/>
  <line x1="328" y1="360" x2="462" y2="360" stroke="#333" stroke-width="2.2"/>
  <path d="M462,360 A8,8 0 0,1 478,360" stroke="#333" stroke-width="2.2" fill="none"/>
  <line x1="478" y1="360" x2="620" y2="360" stroke="#333" stroke-width="2.2"/>
  <text x="132" y="352" font-size="14" font-weight="bold" fill="#333">T</text>
  <circle cx="620" cy="360" r="4.5" fill="#333"/>

  <!-- ======= BACAK 1 (x=320) ======= -->
  <line x1="320" y1="120" x2="320" y2="191" stroke="#333" stroke-width="2.2"/>
  <line x1="320" y1="219" x2="320" y2="426" stroke="#333" stroke-width="2.2"/>
  <line x1="320" y1="454" x2="320" y2="545" stroke="#333" stroke-width="2.2"/>
  <!-- D3 = R+ -->
  <polygon points="303,219 337,219 320,191" fill="#ffcdd2" stroke="#b71c1c" stroke-width="2.2"/>
  <line x1="303" y1="191" x2="337" y2="191" stroke="#b71c1c" stroke-width="3"/>
  <line x1="325" y1="199" x2="362" y2="199" stroke="#6a1b9a" stroke-width="1.8" marker-start="url(#g)"/>
  <text x="366" y="203" font-size="12" font-weight="bold" fill="#6a1b9a">T1</text>
  <text x="252" y="200" text-anchor="end" font-size="13" font-weight="bold" fill="#b71c1c">D3</text>
  <text x="252" y="215" text-anchor="end" font-size="10.5" fill="#999">R+</text>
  <!-- D4 = R- -->
  <polygon points="303,454 337,454 320,426" fill="#bbdefb" stroke="#0d47a1" stroke-width="2.2"/>
  <line x1="303" y1="426" x2="337" y2="426" stroke="#0d47a1" stroke-width="3"/>
  <line x1="325" y1="434" x2="362" y2="434" stroke="#6a1b9a" stroke-width="1.8" marker-start="url(#g)"/>
  <text x="366" y="438" font-size="12" font-weight="bold" fill="#6a1b9a">T4</text>
  <text x="252" y="435" text-anchor="end" font-size="13" font-weight="bold" fill="#0d47a1">D4</text>
  <text x="252" y="450" text-anchor="end" font-size="10.5" fill="#999">R−</text>

  <!-- ======= BACAK 2 (x=470) ======= -->
  <line x1="470" y1="120" x2="470" y2="191" stroke="#333" stroke-width="2.2"/>
  <line x1="470" y1="219" x2="470" y2="426" stroke="#333" stroke-width="2.2"/>
  <line x1="470" y1="454" x2="470" y2="545" stroke="#333" stroke-width="2.2"/>
  <polygon points="453,219 487,219 470,191" fill="#ffcdd2" stroke="#b71c1c" stroke-width="2.2"/>
  <line x1="453" y1="191" x2="487" y2="191" stroke="#b71c1c" stroke-width="3"/>
  <line x1="475" y1="199" x2="512" y2="199" stroke="#6a1b9a" stroke-width="1.8" marker-start="url(#g)"/>
  <text x="516" y="203" font-size="12" font-weight="bold" fill="#6a1b9a">T3</text>
  <text x="446" y="180" text-anchor="end" font-size="13" font-weight="bold" fill="#b71c1c">D5</text>
  <text x="446" y="195" text-anchor="end" font-size="10.5" fill="#999">S+</text>
  <polygon points="453,454 487,454 470,426" fill="#bbdefb" stroke="#0d47a1" stroke-width="2.2"/>
  <line x1="453" y1="426" x2="487" y2="426" stroke="#0d47a1" stroke-width="3"/>
  <line x1="475" y1="434" x2="512" y2="434" stroke="#6a1b9a" stroke-width="1.8" marker-start="url(#g)"/>
  <text x="516" y="438" font-size="12" font-weight="bold" fill="#6a1b9a">T6</text>
  <text x="446" y="470" text-anchor="end" font-size="13" font-weight="bold" fill="#0d47a1">D1</text>
  <text x="446" y="485" text-anchor="end" font-size="10.5" fill="#999">S−</text>

  <!-- ======= BACAK 3 (x=620) ======= -->
  <line x1="620" y1="120" x2="620" y2="191" stroke="#333" stroke-width="2.2"/>
  <line x1="620" y1="219" x2="620" y2="426" stroke="#333" stroke-width="2.2"/>
  <line x1="620" y1="454" x2="620" y2="545" stroke="#333" stroke-width="2.2"/>
  <polygon points="603,219 637,219 620,191" fill="#ffcdd2" stroke="#b71c1c" stroke-width="2.2"/>
  <line x1="603" y1="191" x2="637" y2="191" stroke="#b71c1c" stroke-width="3"/>
  <line x1="625" y1="199" x2="662" y2="199" stroke="#6a1b9a" stroke-width="1.8" marker-start="url(#g)"/>
  <text x="666" y="203" font-size="12" font-weight="bold" fill="#6a1b9a">T5</text>
  <text x="596" y="180" text-anchor="end" font-size="13" font-weight="bold" fill="#b71c1c">D2</text>
  <text x="596" y="195" text-anchor="end" font-size="10.5" fill="#999">T+</text>
  <polygon points="603,454 637,454 620,426" fill="#bbdefb" stroke="#0d47a1" stroke-width="2.2"/>
  <line x1="603" y1="426" x2="637" y2="426" stroke="#0d47a1" stroke-width="3"/>
  <line x1="625" y1="434" x2="662" y2="434" stroke="#6a1b9a" stroke-width="1.8" marker-start="url(#g)"/>
  <text x="666" y="438" font-size="12" font-weight="bold" fill="#6a1b9a">T2</text>
  <text x="596" y="470" text-anchor="end" font-size="13" font-weight="bold" fill="#0d47a1">D6</text>
  <text x="596" y="485" text-anchor="end" font-size="10.5" fill="#999">T−</text>

  <!-- ======= SNUBBER (ornek, D3 uzerinde) ======= -->
  <line x1="276" y1="120" x2="276" y2="152" stroke="#7b1fa2" stroke-width="1.6"/>
  <rect x="266" y="152" width="20" height="34" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.6"/>
  <line x1="276" y1="186" x2="276" y2="214" stroke="#7b1fa2" stroke-width="1.6"/>
  <line x1="264" y1="214" x2="288" y2="214" stroke="#7b1fa2" stroke-width="2"/>
  <line x1="264" y1="223" x2="288" y2="223" stroke="#7b1fa2" stroke-width="2"/>
  <line x1="276" y1="223" x2="276" y2="300" stroke="#7b1fa2" stroke-width="1.6"/>
  <line x1="276" y1="300" x2="320" y2="300" stroke="#7b1fa2" stroke-width="1.6"/>
  <circle cx="276" cy="120" r="4" fill="#7b1fa2"/>
  <text x="190" y="172" font-size="11" font-weight="bold" fill="#7b1fa2">120 Ω</text>
  <text x="190" y="225" font-size="11" font-weight="bold" fill="#7b1fa2">100 nF</text>
  <text x="190" y="243" font-size="10" fill="#7b1fa2">≥400 V film</text>
  <text x="190" y="264" font-size="10.5" font-style="italic" fill="#7b1fa2">6 SCR'nin</text>
  <text x="190" y="277" font-size="10.5" font-style="italic" fill="#7b1fa2">hepsinde var</text>

  <!-- ======= SERBEST DOLASIM DIYODU ======= -->
  <line x1="745" y1="545" x2="745" y2="360" stroke="#2e7d32" stroke-width="2.2"/>
  <polygon points="731,360 759,360 745,334" fill="#c8e6c9" stroke="#1b5e20" stroke-width="2.2"/>
  <line x1="731" y1="334" x2="759" y2="334" stroke="#1b5e20" stroke-width="3"/>
  <line x1="745" y1="334" x2="745" y2="120" stroke="#2e7d32" stroke-width="2.2"/>
  <circle cx="745" cy="120" r="4.5" fill="#2e7d32"/>
  <circle cx="745" cy="545" r="4.5" fill="#2e7d32"/>
  <text x="762" y="296" font-size="12.5" font-weight="bold" fill="#1b5e20">D7</text>
  <text x="762" y="312" font-size="10.5" fill="#1b5e20">1N5408</text>
  <text x="762" y="392" font-size="10.5" fill="#666">serbest</text>
  <text x="762" y="406" font-size="10.5" fill="#666">dolaşım</text>

  <!-- ======= MOTOR ======= -->
  <line x1="880" y1="120" x2="880" y2="176" stroke="#333" stroke-width="2.6"/>
  <circle cx="880" cy="120" r="4.5" fill="#333"/>
  <text x="894" y="150" font-size="12" font-weight="bold" fill="#b71c1c">motor D1 ≃</text>
  <!-- alan sargisi -->
  <path d="M880,176 a11,11 0 1,1 0,22 a11,11 0 1,1 0,22 a11,11 0 1,1 0,22 a11,11 0 1,1 0,22" fill="none" stroke="#333" stroke-width="2.4"/>
  <text x="898" y="220" font-size="11" font-weight="bold" fill="#333">ALAN</text>
  <text x="898" y="234" font-size="11" font-weight="bold" fill="#333">SARGISI</text>
  <text x="898" y="250" font-size="10" fill="#999">(seri)</text>
  <line x1="880" y1="264" x2="880" y2="308" stroke="#333" stroke-width="2.6"/>
  <text x="894" y="290" font-size="11.5" font-weight="bold" fill="#333">motor D2 · A1</text>
  <!-- enduvi -->
  <circle cx="880" cy="342" r="34" fill="#fff" stroke="#333" stroke-width="2.6"/>
  <text x="880" y="340" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">M</text>
  <text x="880" y="356" text-anchor="middle" font-size="11" fill="#666">endüvi</text>
  <line x1="880" y1="376" x2="880" y2="440" stroke="#333" stroke-width="2.6"/>
  <text x="894" y="404" font-size="12" font-weight="bold" fill="#0d47a1">A2</text>
  <!-- ampermetre -->
  <circle cx="880" cy="468" r="26" fill="#fffde7" stroke="#f57f17" stroke-width="2.4"/>
  <text x="880" y="475" text-anchor="middle" font-size="17" font-weight="bold" fill="#e65100">A</text>
  <line x1="880" y1="494" x2="880" y2="545" stroke="#333" stroke-width="2.6"/>
  <circle cx="880" cy="545" r="4.5" fill="#333"/>

  <!-- ======= ALT BILGI ======= -->
  <line x1="60" y1="602" x2="1060" y2="602" stroke="#ddd" stroke-width="1.5"/>
  <text x="60" y="628" font-size="13" font-weight="bold" fill="#111">Ateşleme sırası (60° arayla):</text>
  <text x="290" y="628" font-size="13" fill="#333">T1 (R+) → T2 (T−) → T3 (S+) → T4 (R−) → T5 (T+) → T6 (S−)</text>
  <text x="60" y="654" font-size="13" font-weight="bold" fill="#111">Çıkış:</text>
  <text x="290" y="654" font-size="13" font-style="italic" fill="#333">α ≤ 60° :  V_dc = 1,35 · V_LL · cos α  = 110 · cos α</text>
  <text x="290" y="676" font-size="13" font-style="italic" fill="#333">α &gt; 60° :  V_dc = 110 · [1 + cos(α + 60°)]   (omik yükte süreksiz akım)</text>
  <text x="60" y="676" font-size="11" fill="#999">α, doğal komütasyondan</text>
</svg>
