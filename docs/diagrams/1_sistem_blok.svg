<svg viewBox="0 0 1120 660" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#333"/>
    </marker>
    <marker id="arR" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#c62828"/>
    </marker>
    <marker id="arB" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect width="1120" height="660" fill="#ffffff"/>
  <rect x="0" y="0" width="1120" height="322" fill="#f2f7fd"/>
  <rect x="0" y="322" width="1120" height="338" fill="#fdf4f4"/>

  <!-- baslik -->
  <text x="560" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#111">SİSTEM BLOK DİYAGRAMI</text>
  <text x="560" y="55" text-anchor="middle" font-size="13" fill="#666">Üç fazlı tam kontrollü doğrultucu — B6 köprü</text>

  <!-- taraf etiketleri -->
  <text x="28" y="88" font-size="13" font-weight="bold" fill="#1565c0">KONTROL TARAFI</text>
  <text x="28" y="106" font-size="11" fill="#1565c0">5 V · Arduino GND</text>
  <text x="28" y="628" font-size="13" font-weight="bold" fill="#c62828">GÜÇ TARAFI</text>
  <text x="28" y="646" font-size="11" fill="#c62828">47 V AC · 110 V DC</text>

  <!-- izolasyon bariyeri -->
  <line x1="30" y1="322" x2="1090" y2="322" stroke="#2e7d32" stroke-width="3" stroke-dasharray="14,7"/>
  <rect x="806" y="308" width="264" height="28" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5" rx="4"/>
  <text x="938" y="327" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">5 kV OPTİK İZOLASYON</text>

  <!-- ARDUINO -->
  <rect x="300" y="92" width="212" height="88" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="406" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">ARDUINO UNO</text>
  <text x="406" y="142" text-anchor="middle" font-size="11" fill="#1565c0">ATmega328P · 16 MHz</text>
  <text x="406" y="161" text-anchor="middle" font-size="11" fill="#1565c0">PCINT1 + Timer1 (50 µs)</text>

  <!-- ULN -->
  <rect x="616" y="92" width="188" height="88" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="710" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">ULN2003A</text>
  <text x="710" y="142" text-anchor="middle" font-size="11" fill="#1565c0">açık kollektör sink</text>
  <text x="710" y="161" text-anchor="middle" font-size="11" fill="#1565c0">güvenli kapalı durum</text>

  <!-- LTV-844 (bariyeri keser) -->
  <rect x="312" y="262" width="188" height="118" rx="7" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="406" y="290" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a148c">LTV-844</text>
  <text x="406" y="309" text-anchor="middle" font-size="11" fill="#6a1b9a">AC girişli optokuplör</text>
  <text x="406" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#6a1b9a">ÖLÇÜM ↑</text>
  <text x="406" y="365" text-anchor="middle" font-size="10.5" fill="#6a1b9a">sıfır geçiş · 3 kanal</text>

  <!-- MOC (bariyeri keser) -->
  <rect x="616" y="262" width="188" height="118" rx="7" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="710" y="290" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a148c">MOC3023 × 6</text>
  <text x="710" y="309" text-anchor="middle" font-size="11" fill="#6a1b9a">fototriyak çıkışlı</text>
  <text x="710" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#6a1b9a">KOMUT ↓</text>
  <text x="710" y="365" text-anchor="middle" font-size="10.5" fill="#6a1b9a">yüzen gate sürücü</text>

  <!-- TRAFO -->
  <rect x="58" y="452" width="184" height="126" rx="7" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
  <text x="150" y="482" text-anchor="middle" font-size="15" font-weight="bold" fill="#b71c1c">İZOLE TRAFO</text>
  <text x="150" y="502" text-anchor="middle" font-size="11" fill="#c62828">SO3636-2G · 300 VA</text>
  <text x="150" y="520" text-anchor="middle" font-size="11" fill="#c62828">3 × 47 V yıldız</text>
  <text x="150" y="538" text-anchor="middle" font-size="11" fill="#c62828">V_LL = 81,4 V</text>
  <text x="150" y="562" text-anchor="middle" font-size="10.5" fill="#888">R · S · T · N</text>

  <!-- B6 -->
  <rect x="580" y="452" width="200" height="126" rx="7" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
  <text x="680" y="482" text-anchor="middle" font-size="15" font-weight="bold" fill="#b71c1c">B6 KÖPRÜ</text>
  <text x="680" y="502" text-anchor="middle" font-size="11" fill="#c62828">6 × BT151-500R</text>
  <text x="680" y="520" text-anchor="middle" font-size="11" fill="#c62828">snubber + serbest dolaşım</text>
  <text x="680" y="545" text-anchor="middle" font-size="11" font-style="italic" fill="#c62828">V_dc = 1,35·V_LL·cos α</text>
  <text x="680" y="563" text-anchor="middle" font-size="10.5" fill="#888">6 darbe / çevrim → 300 Hz</text>

  <!-- MOTOR -->
  <rect x="858" y="452" width="162" height="126" rx="7" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
  <circle cx="939" cy="497" r="21" fill="none" stroke="#b71c1c" stroke-width="2.5"/>
  <text x="939" y="503" text-anchor="middle" font-size="15" font-weight="bold" fill="#b71c1c">M</text>
  <text x="939" y="538" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b71c1c">UNIVERSAL</text>
  <text x="939" y="555" text-anchor="middle" font-size="10.5" fill="#c62828">SE2662-3E · 220 V⎓</text>
  <text x="939" y="570" text-anchor="middle" font-size="10.5" fill="#c62828">0,25 kW · 3000 d/dk</text>

  <!-- 1: TRAFO -> LTV -->
  <path d="M242,470 L406,470 L406,382" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arB)"/>
  <rect x="246" y="447" width="150" height="19" fill="#f2f7fd" opacity="0.9"/>
  <text x="250" y="461" font-size="11" fill="#1565c0">R,S,T,N — 15 kΩ · 4 mA</text>

  <!-- 2: LTV -> ARDUINO -->
  <path d="M406,262 L406,184" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arB)"/>
  <text x="416" y="228" font-size="11.5" font-weight="bold" fill="#1565c0">A1 · A2 · A3</text>
  <text x="416" y="244" font-size="10.5" fill="#888">3 bit sektör kodu</text>

  <!-- 3: ARDUINO -> ULN -->
  <path d="M512,136 L610,136" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arB)"/>
  <text x="561" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">D5–D10</text>

  <!-- 4: ULN -> MOC -->
  <path d="M710,184 L710,258" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arB)"/>
  <text x="720" y="216" font-size="11" fill="#1565c0">sink 11,9 mA</text>
  <text x="720" y="232" font-size="10.5" fill="#888">LED akımı</text>

  <!-- 5: MOC -> B6 -->
  <path d="M710,382 L710,448" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#arR)"/>
  <text x="720" y="404" font-size="11" font-weight="bold" fill="#c62828">gate darbeleri</text>
  <text x="720" y="420" font-size="10.5" fill="#888">6 × yüzen</text>

  <!-- 6: TRAFO -> B6 (guc) -->
  <path d="M242,556 L574,556" fill="none" stroke="#c62828" stroke-width="5" marker-end="url(#arR)"/>
  <rect x="300" y="562" width="216" height="19" fill="#fdf4f4" opacity="0.9"/>
  <text x="408" y="576" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#c62828">R · S · T — güç yolu · ≤ 1,3 A</text>

  <!-- 7: B6 -> MOTOR -->
  <path d="M780,514 L852,514" fill="none" stroke="#c62828" stroke-width="5" marker-end="url(#arR)"/>
  <text x="816" y="488" text-anchor="middle" font-size="10" font-weight="bold" fill="#c62828">DC+ / DC−</text>
  <text x="816" y="502" text-anchor="middle" font-size="10" fill="#888">0–110 V</text>

  <!-- not kutusu -->
  <rect x="838" y="92" width="252" height="150" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  <text x="852" y="114" font-size="12" font-weight="bold" fill="#333">İki yönlü bilgi akışı</text>
  <line x1="852" y1="122" x2="1076" y2="122" stroke="#ddd"/>
  <text x="852" y="142" font-size="11" fill="#4a148c">↑ LTV-844 — ölçüm taşır</text>
  <text x="862" y="158" font-size="10.5" fill="#666">"faz şu anda nerede?"</text>
  <text x="852" y="182" font-size="11" fill="#4a148c">↓ MOC3023 — komut taşır</text>
  <text x="862" y="198" font-size="10.5" fill="#666">"şimdi ateşle"</text>
  <text x="852" y="224" font-size="10.5" font-style="italic" fill="#2e7d32">Optokuplörden akım değil,</text>
  <text x="852" y="238" font-size="10.5" font-style="italic" fill="#2e7d32">ışık geçer. Galvanik bağ yok.</text>
</svg>
